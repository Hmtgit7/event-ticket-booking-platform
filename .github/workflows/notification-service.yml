name: Notification service
on:
  push:
    branches: [main]
    paths:
      - "services/notification-service/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/notification-service.yml"
  pull_request:
    paths:
      - "services/notification-service/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/notification-service.yml"
jobs:
  lint-typecheck-test-build:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir services/notification-service exec prisma generate
      - name: Lint
        run: pnpm --dir services/notification-service exec eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0
      - name: Typecheck
        run: pnpm --dir services/notification-service exec tsc --noEmit
      - name: Test
        run: pnpm --dir services/notification-service test
      - name: Build
        run: pnpm --dir services/notification-service build
