services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grabmyticket
      POSTGRES_PASSWORD: grabmyticket
      POSTGRES_DB: grabmyticket
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command: ["redpanda", "start", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--overprovisioned", "--node-id", "0", "--check=false", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://localhost:9092"]
    ports:
      - "9092:9092"
      - "9644:9644"
volumes:
  postgres-data:

