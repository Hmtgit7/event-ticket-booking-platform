spring:
  application:
    name: notification-service
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  booking-events-topic: ${BOOKING_EVENTS_TOPIC:booking-events}
  mail:
    from: ${MAIL_FROM:no-reply@grabmyticket.local}

