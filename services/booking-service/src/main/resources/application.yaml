spring:
  application:
    name: booking-service
  profiles:
    default: local

  flyway:
    # Each service owns its own schema history table to avoid version collisions
    # when multiple services share the same database.
    table: flyway_schema_history_booking
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:${SERVER_PORT:8083}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: grabmyticket-auth
    secret: ${JWT_SECRET:change-me-local-development-secret-change-me}
  booking:
    hold-ttl: ${BOOKING_HOLD_TTL:5m}
    events-topic: ${BOOKING_EVENTS_TOPIC:booking-events}
    # Fraction of gross confirmed-booking revenue GrabMyTicket keeps before an
    # organizer's payout balance is computed. Placeholder value - confirm the
    # real commission rate with Hemant before go-live, this is not a decision
    # Claude should make.
    platform-commission-rate: ${PLATFORM_COMMISSION_RATE:0.10}
    # Fraction of a cancelled booking's totalAmount withheld as a cancellation
    # fee before the remainder is refunded to the customer's wallet. Placeholder
    # value - confirm the real rate with Hemant before go-live.
    cancellation-fee-rate: ${CANCELLATION_FEE_RATE:0.05}
  payment:
    # Must match payment-service's app.payment.events-topic exactly - this is
    # the topic PaymentEventListener consumes to credit wallet recharges.
    events-topic: ${PAYMENT_EVENTS_TOPIC:payment-events}
  internal:
    secret: ${INTERNAL_API_SECRET:change-me-local-development-internal-secret}
  event-service:
    base-url: ${EVENT_SERVICE_BASE_URL:http://localhost:8082}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000},${CORS_ADDITIONAL_ORIGINS:}
