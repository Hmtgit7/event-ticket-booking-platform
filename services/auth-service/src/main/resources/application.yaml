spring:
  application:
    name: auth-service
  profiles:
    default: local

  # Datasource defaults (overridden per-profile)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/grabmyticket}
    username: ${DATABASE_USERNAME:grabmyticket}
    password: ${DATABASE_PASSWORD:grabmyticket}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each service owns its own schema history table to avoid version collisions
    # when multiple services share the same database.
    table: flyway_schema_history_auth
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${PORT:${SERVER_PORT:8081}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: grabmyticket-auth
    secret: ${JWT_SECRET:change-me-local-development-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000},${CORS_ADDITIONAL_ORIGINS:}
  verification:
    token-ttl: ${VERIFICATION_TOKEN_TTL:24h}
    resend-cooldown: ${VERIFICATION_RESEND_COOLDOWN:60s}
  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${SMTP_FROM:}
    sender-name: ${BREVO_SENDER_NAME:GrabMyTicket}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:}
