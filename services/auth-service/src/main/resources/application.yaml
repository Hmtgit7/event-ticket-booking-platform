spring:
  application:
    name: auth-service
  profiles:
    default: local

  # Datasource defaults (overridden per-profile)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/grabmyticket}
    username: ${DATABASE_USERNAME:grabmyticket}
    password: ${DATABASE_PASSWORD:grabmyticket}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: grabmyticket-auth
    secret: ${JWT_SECRET:change-me-local-development-secret-change-me}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
