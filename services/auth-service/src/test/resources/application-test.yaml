spring:
  datasource:
    url: jdbc:h2:mem:auth_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    # Flyway migrations use PostgreSQL-specific syntax (gen_random_uuid, TIMESTAMPTZ).
    # In tests we let Hibernate generate the schema from entities instead.
    enabled: false

