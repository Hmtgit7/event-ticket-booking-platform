spring:
  application:
    name: event-service
  profiles:
    default: local

server:
  port: ${PORT:${SERVER_PORT:8082}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    issuer: grabmyticket-auth
    secret: ${JWT_SECRET:change-me-local-development-secret-change-me}
  internal:
    secret: ${INTERNAL_API_SECRET:change-me-local-development-internal-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

