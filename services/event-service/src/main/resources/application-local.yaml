spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/grabmyticket}
    username: ${DATABASE_USERNAME:grabmyticket}
    password: ${DATABASE_PASSWORD:grabmyticket}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  flyway:
    # Each service owns its own schema history table to avoid version collisions
    # when multiple services share the same database.
    table: flyway_schema_history_event
    # The public schema already has tables from other services. Tell Flyway to
    # baseline (mark as pre-existing) before running its own migrations.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

