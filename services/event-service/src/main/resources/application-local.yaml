spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/grabmyticket}
    username: ${DATABASE_USERNAME:grabmyticket}
    password: ${DATABASE_PASSWORD:grabmyticket}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  flyway:
    # Each service owns its own schema history table to avoid version collisions
    # when multiple services share the same database.
    table: flyway_schema_history_event
    # The public schema already has tables from other services. Tell Flyway to
    # baseline (mark as pre-existing) before running its own migrations.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      # Flyway owns all schema changes here, same as every other service -
      # this was previously left as "update" (a known past mistake per this
      # project's own history: it lets Hibernate silently auto-alter schema
      # independent of Flyway, which is exactly what produces "migration
      # resolved but not applied" drift like the one that just happened).
      ddl-auto: validate
    open-in-view: false

