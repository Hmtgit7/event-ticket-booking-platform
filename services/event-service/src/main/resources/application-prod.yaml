spring:
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      # Upstash Redis - use the full rediss:// URL with TLS.
      # Format: rediss://default:<UPSTASH_REDIS_REST_TOKEN>@<host>:<port>
      # Set REDIS_URL on Render to: rediss://default:<token>@<host>:6380
      url: ${REDIS_URL}
      ssl:
        enabled: true
  cache:
    type: redis
  flyway:
    # Each service owns its own schema history table to avoid version collisions
    # when multiple services share the same database.
    table: flyway_schema_history_event
    # The public schema already has tables from other services. Tell Flyway to
    # baseline (mark as pre-existing) before running its own migrations.
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

